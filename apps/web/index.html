<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` asks the browser to shrink the layout
      viewport when the on-screen keyboard opens, instead of covering the page
      with it. Together with the dynamic-viewport-height layout, that keeps the
      bottom navigation reachable while typing, and avoids the gap Safari can
      leave behind once the keyboard closes.

      Zoom is deliberately NOT disabled: this app is used by people who may need
      to magnify it, and blocking that to save ourselves a layout concern would
      be the wrong trade.

      ⚠️ **`viewport-fit=cover` is what makes every `env(safe-area-inset-*)` in this
      application do anything at all.** Without it iOS reports all four insets as
      `0px` — on the grounds that the page has already been laid out inside the safe
      area — so the bottom navigation's `pb-[env(safe-area-inset-bottom)]` and the
      sheets' `pb-[calc(...)]` were **reading a constant zero**, and the app sat
      against the home indicator on every phone that has one.

      ⚠️ **A one-word omission whose symptom is a layout that looks right on a
      desktop, right in a browser's device emulator, and wrong only on real
      hardware.** Found while building the ledger space's presentation state — the
      first screen whose content had to reach the display's edges on purpose.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      1.17.24：关掉 Safari 对页面文字的自动识别（电话号码、日期、地址、邮箱会被悄悄变成链接）。
      账目的备注里常有这类数字；变成链接后，长按那一笔会触发系统的链接手势（预览、拖出链接），
      与「长按拖到另一个工作区」抢同一次触摸。
    -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="description" content="Libevra：个人独立开发、AI 工具辅助的非商业记账项目，尚未正式向公众发布。" />
    <title>Libevra</title>
    <!--
      1.19.47：切换账本需要整页重新载入。上一页的海浪转场盖满整屏后存下最后一帧，tide-resume.js 在第一次绘制前
      把它铺满屏幕（不再白屏），入口在第一次渲染前换成会动的浪、协调器挂载后接着划过（src/s19/motion/tide.ts）。
      普通同源脚本，符合生产 CSP。
      1.19.48：::before 是等待提示（与 tide.css 的 .tide-hint-text 字样一致，淡入按同一时刻计时）；
      不能接着播放时 [data-tide-resume="fade"] 淡出，不硬切。
    -->
    <style>
      html[data-tide-resume]::after {
        content: ""; position: fixed; inset: 0; z-index: 2147483000; pointer-events: none;
        background: var(--tide-resume-image) center / 100% 100% no-repeat, var(--tide-resume-color);
      }
      html[data-tide-resume]::before {
        content: var(--tide-resume-hint, ""); position: fixed; left: 0; right: 0; top: var(--tide-resume-hint-y, 50%);
        z-index: 2147483001; pointer-events: none; padding: 0 24px; text-align: center; transform: translateY(-50%);
        font: 400 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.08em;
        color: var(--tide-resume-hint-color, #fff); text-shadow: var(--tide-resume-hint-shadow, none);
        animation: tide-resume-hint var(--tide-resume-hint-fade, 200ms) ease-out var(--tide-resume-hint-delay, 0ms) both;
      }
      html[data-tide-resume="fade"]::before { content: none; }
      html[data-tide-resume="fade"]::after { animation: tide-resume-out 200ms ease-out forwards; }
      @keyframes tide-resume-hint { from { opacity: 0; } to { opacity: 0.92; } }
      @keyframes tide-resume-out { to { opacity: 0; } }
    </style>
    <script src="/tide-resume.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
